<form class="flex flex-col gap-5" [formGroup]="form" (ngSubmit)="onSubmit()">
  <app-input
    class="w-full"
    label="Firmenname"
    placeholder="Muster GmbH"
    formControlName="companyName"
    [error]="fieldError('companyName')"
  />

  <app-input
    class="w-full"
    label="Straße"
    placeholder="Musterstraße"
    formControlName="street"
    [error]="fieldError('street')"
  />

  <div class="grid gap-5 sm:grid-cols-2">
    <app-input
      class="w-full"
      type="number"
      label="Hausnummer"
      placeholder="1"
      formControlName="houseNumber"
      [error]="fieldError('houseNumber')"
    />
    <app-input
      class="w-full"
      type="number"
      label="PLZ"
      placeholder="12345"
      formControlName="postalCode"
      [error]="fieldError('postalCode')"
    />
  </div>

  <div class="grid gap-5 sm:grid-cols-2">
    <app-input
      class="w-full"
      label="Stadt"
      placeholder="Berlin"
      formControlName="city"
      [error]="fieldError('city')"
    />
    <app-input
      class="w-full"
      label="Land"
      placeholder="Deutschland"
      formControlName="country"
      [error]="fieldError('country')"
    />
  </div>

  @if (errorMessage()) {
    <p class="rounded-xl bg-red-50 px-4 py-3 text-sm text-red-600">
      {{ errorMessage() }}
    </p>
  }

  <div class="flex flex-col gap-3 sm:flex-row sm:justify-between">
    <app-button type="button" variant="outline" size="lg" (click)="goBack()">
      Zurück
    </app-button>
    <app-button type="submit" size="lg" [disabled]="isLoading()">
      {{ isLoading() ? 'Wird registriert…' : 'Weiter' }}
    </app-button>
  </div>
</form>
