<div class="flex min-h-screen flex-col items-center justify-center bg-slate-50 px-4">
  <div class="w-full max-w-md rounded-2xl bg-white p-10 text-center shadow-sm">
    <img [src]="logoUrl" alt="Timeify Logo" class="mx-auto mb-6 w-24" />

    <h1 class="text-3xl font-bold text-primary">
      Time<span class="text-secondary">ify</span> Dashboard
    </h1>

    <p class="mt-3 text-text-light">
      Willkommen! Das Dashboard wird als Nächstes umgesetzt.
    </p>

    <a routerLink="/" class="mt-8 inline-block">
      <app-button variant="outline">Zur Startseite</app-button>
    </a>
  </div>
</div>
