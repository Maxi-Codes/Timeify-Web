<section class="relative px-6 py-32">
  <div class="features-inner mx-auto max-w-7xl">
    <div class="fade-in text-center mb-20">
      <h2 class="mb-6 text-5xl font-semibold text-[#111827] md:text-6xl">
        Alles, was du brauchst
      </h2>

      <p class="mx-auto max-w-2xl text-xl text-[#6B7280]">
        Timeify vereint alle wichtigen Funktionen für modernes Zeitmanagement
      </p>
    </div>

    <div class="grid gap-8 md:grid-cols-3">
      <article
        *ngFor="let feature of features; let i = index"
        class="feature-card rounded-3xl bg-white p-12 shadow-sm transition-shadow hover:shadow-xl"
        [style.animation-delay]="i * 0.2 + 's'"
      >
        <div
          class="mb-6 flex h-16 w-16 items-center justify-center rounded-2xl"
          [style.background-color]="feature.color"
        >
          <ng-container [ngSwitch]="feature.icon">
            <svg
              *ngSwitchCase="'clock'"
              class="h-8 w-8 text-white"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10" />
              <polyline points="12 6 12 12 16 14" />
            </svg>

            <svg
              *ngSwitchCase="'calendar'"
              class="h-8 w-8 text-white"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M8 2v4" />
              <path d="M16 2v4" />
              <rect width="18" height="18" x="3" y="4" rx="2" />
              <path d="M3 10h18" />
            </svg>

            <svg
              *ngSwitchCase="'heart'"
              class="h-8 w-8 text-white"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M19.5 12.6 12 20l-7.5-7.4A5 5 0 0 1 12 6a5 5 0 0 1 7.5 6.6Z"
              />
            </svg>
          </ng-container>
        </div>

        <h3 class="mb-4 text-3xl font-semibold text-[#111827]">
          {{ feature.title }}
        </h3>

        <p class="text-lg leading-relaxed text-[#6B7280]">
          {{ feature.description }}
        </p>
      </article>
    </div>

    <div class="fade-in delayed text-center mt-20">
      <p class="text-lg text-[#6B7280]">
        Und das ist erst der Anfang – weitere Funktionen folgen in Kürze
      </p>
    </div>
  </div>
</section>
