<footer class="border-t border-gray-200 py-12 px-6">
  <div class="mx-auto max-w-7xl">
    <div
      class="flex flex-col items-center justify-between gap-6 md:flex-row"
    >
      <div class="flex items-center gap-3">
        <div
          class="flex h-10 w-10 items-center justify-center rounded-xl"
        >
          <img
            [src]="logoUrl"
            alt="Timeify Logo"
            class="h-full w-full object-contain"
          />
        </div>

        <span class="text-xl font-semibold text-[#0B1F3A]">
          Time<span class="text-[#F59E0B]">ify</span>
        </span>
      </div>

      <p class="text-gray-500">
        © {{ currentYear }} Timeify. Alle Rechte vorbehalten.
      </p>
    </div>
  </div>
</footer>
