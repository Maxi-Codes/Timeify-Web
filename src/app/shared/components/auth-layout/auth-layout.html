<div class="flex min-h-screen items-center justify-center bg-slate-50 px-4 py-10">
  <div
    class="w-full max-w-lg rounded-2xl bg-slate-100 px-8 py-10 shadow-sm sm:px-12"
  >
    <div class="flex flex-col items-center gap-3">
      <a routerLink="/" class="block w-28">
        <img [src]="logoUrl" alt="Timeify Logo" class="w-full" />
      </a>

      <h1 class="text-4xl font-bold tracking-tight text-primary">
        Time<span class="text-secondary">ify</span>
      </h1>

      <h2 class="text-center text-xl font-semibold leading-tight text-text">
        {{ title() }}
      </h2>

      @if (subtitle()) {
        <p class="text-center text-sm text-text-light">
          {{ subtitle() }}
        </p>
      }
    </div>

    <div class="mt-10">
      <ng-content />
    </div>
  </div>
</div>
